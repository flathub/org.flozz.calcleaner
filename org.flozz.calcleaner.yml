id: org.flozz.calcleaner
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: calcleaner
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
cleanup:
  - /share/man
cleanup-commands:
  - python3 -m compileall --invalidation-mode=unchecked-hash /app
modules:
  - python3-meson-python.json
  - python3-six.json
  - name: calcleaner
    buildsystem: simple
    build-commands:
      # Build locales
      - ./build-locales.py
      # Build and install CalCleaner
      - pip3 install --verbose --exists-action=i --no-build-isolation --no-index --find-links="file://${PWD}" --prefix="${FLATPAK_DEST}" "."
      # Force installing lxml (pip refuses to install it as a dependency of caldav
      # as it is already available in the sdk...)
      - pip3 install --ignore-installed --no-build-isolation --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix="${FLATPAK_DEST}" "lxml"
      # Copy app data
      - ./linuxpkg/copy-data.sh ${FLATPAK_DEST}
    sources:
      - dependencies.json
      - type: file
        path: ./build-locales.py
      - type: git
        url: https://github.com/flozz/calcleaner.git
        tag: v1.1.4-2
        commit: ec6b403838d614ac2c0cfb1bf6124fb479109b4b
